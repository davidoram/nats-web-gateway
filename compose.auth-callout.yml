name: nats-web-gateway-auth-callout

services:
  hydra:
    image: docker.io/oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    command: ["serve", "all", "--dev"]
    environment:
      DSN: memory
      URLS_SELF_ISSUER: http://hydra:4444
      URLS_CONSENT: http://127.0.0.1/unused
      URLS_LOGIN: http://127.0.0.1/unused
      SECRETS_SYSTEM: this-is-a-non-production-32-byte-test-secret
      STRATEGIES_ACCESS_TOKEN: opaque
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "false"
    ports: ["127.0.0.1:14444:4444", "127.0.0.1:14445:4445"]

  hydra-cli:
    image: docker.io/oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    depends_on: [hydra]
    command: ["create", "oauth2-client", "--endpoint", "http://hydra:4445", "--id", "gateway-fixture", "--secret", "local-client-secret", "--grant-type", "client_credentials", "--scope", "gateway:invoke", "--audience", "nats-gateway"]
    restart: on-failure

  hydra-cli-wrong-audience:
    image: docker.io/oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    depends_on: [hydra]
    command: ["create", "oauth2-client", "--endpoint", "http://hydra:4445", "--id", "wrong-audience-fixture", "--secret", "local-wrong-audience-secret", "--grant-type", "client_credentials", "--scope", "gateway:invoke", "--audience", "other-audience"]
    restart: on-failure

  hydra-cli-wrong-scope:
    image: docker.io/oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    depends_on: [hydra]
    command: ["create", "oauth2-client", "--endpoint", "http://hydra:4445", "--id", "wrong-scope-fixture", "--secret", "local-wrong-scope-secret", "--grant-type", "client_credentials", "--scope", "other:scope", "--audience", "nats-gateway"]
    restart: on-failure

  nats-auth:
    image: docker.io/library/nats:2.12.4-alpine@sha256:31c6ed3b2da61645aaa3ad9217b5a52b34b6ebd555ecb71259cd7723c59ae1ea
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports: ["127.0.0.1:24222:4222", "127.0.0.1:28222:8222"]
    volumes: ["./integration/auth-callout/nats-server.conf:/etc/nats/nats-server.conf:ro"]

  auth-callout:
    image: docker.io/library/alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command: ["/usr/local/bin/auth-callout"]
    environment:
      NATS_URL: nats://nats-auth:4222
      NATS_USER: auth_callout
      NATS_PASSWORD: local-callout-only
      AUTH_CALLOUT_ISSUER_SEED: SAANDLKMXL6CUS3CP52WIXBEDN6YJ545GDKC65U5JZPPV6WH6ESWUA6YAI
      HYDRA_INTROSPECTION_URL: http://hydra:4445/admin/oauth2/introspect
      HYDRA_CLIENT_ID: gateway-fixture
      HYDRA_CLIENT_SECRET: local-client-secret
      HYDRA_AUDIENCE: nats-gateway
      HYDRA_SCOPE: gateway:invoke
    volumes: ["./build/integration/auth-callout:/usr/local/bin/auth-callout:ro"]
    depends_on: [nats-auth, hydra]

  auth-echo:
    image: docker.io/library/alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command: ["/usr/local/bin/auth-echo"]
    environment: {NATS_URL: "nats://nats-auth:4222", NATS_USER: auth_echo, NATS_PASSWORD: local-echo-only}
    volumes: ["./build/integration/auth-echo:/usr/local/bin/auth-echo:ro"]
    depends_on: [nats-auth]

  caddy-auth:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    command: ["/usr/local/bin/caddy-local", "run", "--config", "/etc/caddy/caddy.json"]
    ports: ["127.0.0.1:28080:8080"]
    volumes: ["./build/integration/caddy:/usr/local/bin/caddy-local:ro", "./integration/auth-callout/caddy.json:/etc/caddy/caddy.json:ro"]
    depends_on: [auth-callout, auth-echo]
