server_name: local-integration
port: 4222
http_port: 8222

authorization {
  users: [
    {
      user: gateway
      password: local-gateway-only
      permissions: {
        publish: ["demo.echo", "demo.echo.*.*", "demo.malformed", "demo.slow", "demo.missing", "$SRV.PING"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: adr32_service
      password: local-service-only
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["demo.echo", "demo.echo.*.*", "demo.malformed", "demo.slow", "$SRV.>"]
      }
    }
  ]
}

max_payload: 1048576
write_deadline: "5s"
