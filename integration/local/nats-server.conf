server_name: local-integration
port: 4222
http_port: 8222

authorization {
  users: [
    {
      user: gateway
      password: local-gateway-only
      permissions: {
        publish: ["demo.echo", "demo.echo.*.*", "demo.malformed", "demo.slow", "demo.missing", "pets.rest.create", "pets.rest.list", "pets.rest.get.*", "pets.rest.update.*", "pets.rest.delete.*", "pets.rpc.*"]
        subscribe: ["_INBOX.>", "demo.events"]
      }
    }
    {
      user: discovery_test
      password: local-discovery-only
      permissions: {
        publish: ["$SRV.PING", "$SRV.PING.*", "$SRV.PING.*.*", "$SRV.INFO", "$SRV.INFO.*", "$SRV.INFO.*.*", "$SRV.STATS", "$SRV.STATS.*", "$SRV.STATS.*.*", "compat.work", "demo.events", "_INBOX.>"]
        subscribe: ["_INBOX.>", "compat.work", "$SRV.>"]
      }
    }
    {
      user: pets_service
      password: local-pets-only
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["pets.rest.create", "pets.rest.list", "pets.rest.get.*", "pets.rest.update.*", "pets.rest.delete.*", "pets.rpc.*", "$SRV.>"]
      }
    }
    {
      user: adr32_service
      password: local-service-only
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["demo.echo", "demo.echo.*.*", "demo.malformed", "demo.slow", "$SRV.>"]
      }
    }
  ]
}

max_payload: 1048576
write_deadline: "5s"
